name: PR check

on: pull_request

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@27082cecf3ff7a1742dbd5e12605f0cb59dce2d9 # v2.1.3
        with:
          node-version: "16.20.2"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Setup dependencies (setup dependencies in packages)
        run: npm run setup

      - name: Build packages (Compile contracts, generate contract types and compile typescript)
        run: npm run build

      - name: Build type checking
        run: npx tsc --project tsconfig.type-checking.json

      - name: Run test
        run: npm test
