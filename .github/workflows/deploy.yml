name: Deploy

on:
  push:
    branches: [ 'develop', 'master' ]

jobs:
  deploy:
    if: "!contains(github.event.head_commit.author.name, 'GITHUB_ACTION')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      packages: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v2-beta
        with:
          node-version: '16.10.0'
          registry-url: https://registry.npmjs.org/

      - name: Set npm credentials
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      # go-ipfs-dep (unused peer of ipfsd-ctl) downloads go-ipfs from dist.ipfs.tech during setup,
      # and some of that host's IPv4 servers time out. Pin the first one that responds.
      - name: Pin a reachable dist.ipfs.tech server
        run: |
          for ip in $(getent ahostsv4 dist.ipfs.tech | awk '{ print $1 }' | sort -u); do
            if curl -sf -m 10 --resolve "dist.ipfs.tech:443:$ip" -o /dev/null https://dist.ipfs.tech/go-ipfs/versions; then
              echo "$ip dist.ipfs.tech" | sudo tee -a /etc/hosts
              break
            fi
            echo "dist.ipfs.tech server $ip did not respond"
          done

      - name: Install package
        run: |
          npm ci
          npm run setup

      - name: Build package
        run: npm run build

      - name: Output Run number
        run: echo ${{ github.run_number }}

      - name: Deploy on develop branch
        if: github.ref == 'refs/heads/develop'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          npm run publish:canary

      - name: Deploy on master branch
        if: github.ref == 'refs/heads/master'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "GITHUB_ACTION"
          npm run publish:release
        
  sync_master_to_develop_branch :
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
      deployments: write
      packages: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit to develop branch and merge to master branch
        run: |
          git config --global user.email ${{ secrets.GH_EMAIL }}
          git config --global user.name ${{ secrets.GH_USER }}
          git merge origin/master
          git push origin develop

