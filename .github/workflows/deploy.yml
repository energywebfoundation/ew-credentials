name: Deploy

on:
  push:
    branches: [ 'develop', 'master' ]

jobs:
  deploy:
    if: "!contains(github.event.head_commit.author.name, 'GITHUB_ACTION')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      packages: write
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@27082cecf3ff7a1742dbd5e12605f0cb59dce2d9 # v2.1.3
        with:
          node-version: '16.20.2'
          registry-url: https://registry.npmjs.org/

      - name: Set npm credentials
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Install package
        run: |
          npm ci
          npm run setup

      - name: Build package
        run: npm run build

      - name: Output Run number
        run: echo ${{ github.run_number }}

      - name: Deploy on develop branch
        if: github.ref == 'refs/heads/develop'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          npm run publish:canary

      - name: Deploy on master branch
        if: github.ref == 'refs/heads/master'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "GITHUB_ACTION"
          npm run publish:release
        
  sync_master_to_develop_branch :
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
      deployments: write
      packages: write
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit to develop branch and merge to master branch
        run: |
          git config --global user.email ${{ secrets.GH_EMAIL }}
          git config --global user.name ${{ secrets.GH_USER }}
          git merge origin/master
          git push origin develop

