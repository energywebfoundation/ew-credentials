name: Lint source code

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: actions/setup-node@27082cecf3ff7a1742dbd5e12605f0cb59dce2d9 # v2.1.3
        with:
          node-version: "16.20.2"
          registry-url: https://registry.npmjs.org/
      - name: Install modules
        run: npm ci
      - name: Bootstrap packages
        run: npm run setup
      - name: Build
        run: npm run build
      - name: Run ESLint
        run: npx eslint --output-file eslint_report.json --format json packages/*/src
      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@a1bf7cb320a18aa53cb848a267ce9b7417221526 # 1.2.0
        if: always()
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          report-json: 'eslint_report.json'
      - name: Run Prettier
        run: npx prettier --check packages/*/src/**/*.*s packages/*/test/**/*.*s
